name: Bulk Scrape Novels (Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      novels:
        description: "Novels to scrape ('three', 'all', or specific slug like 'my-vampire-system')"
        required: true
        default: 'three'
      start_chapter:
        description: 'Optional Start Chapter (leave blank for auto-detect / backlog)'
        required: false
        default: ''
      end_chapter:
        description: 'Optional End Chapter (leave blank for full archive)'
        required: false
        default: ''
      workers:
        description: 'Concurrent worker threads'
        required: false
        default: '4'

permissions:
  contents: write

jobs:
  bulk-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 requests

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Bulk Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--novels ${{ github.event.inputs.novels }} --workers ${{ github.event.inputs.workers }} --push"
          if [ -n "${{ github.event.inputs.start_chapter }}" ]; then
            ARGS="$ARGS --start ${{ github.event.inputs.start_chapter }}"
          fi
          if [ -n "${{ github.event.inputs.end_chapter }}" ]; then
            ARGS="$ARGS --end ${{ github.event.inputs.end_chapter }}"
          fi
          echo "Executing: python scripts/bulk_novel_scraper.py $ARGS"
          python scripts/bulk_novel_scraper.py $ARGS
