name: Fetch Web Novel Chapters

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'Start Chapter Number (e.g. 1)'
        required: true
        default: '1'
      end_chapter:
        description: 'End Chapter Number (e.g. 50)'
        required: true
        default: '50'
      novel_id:
        description: 'Novel ID / Slug (e.g. supreme-harem-god-system or infinite-mana-in-the-apocalypse)'
        required: false
        default: 'infinite-mana-in-the-apocalypse'

permissions:
  contents: write

jobs:
  scrape-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4

      - name: Fetch and Bundle Chapters
        run: |
          python scripts/github_chapter_fetcher.py \
            --novel-id ${{ github.event.inputs.novel_id }} \
            --start ${{ github.event.inputs.start_chapter }} \
            --end ${{ github.event.inputs.end_chapter }} \
            --output-dir data

      - name: Commit and Push New Chapter Bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Add Chapter Bundle [${{ github.event.inputs.novel_id }}] ${{ github.event.inputs.start_chapter }}-${{ github.event.inputs.end_chapter }}" && git push)
